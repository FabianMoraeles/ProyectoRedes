<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AdoptaMatch</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #11151f;
    --panel-2: #161b28;
    --border: #232a3a;
    --text: #e7ebf3;
    --text-dim: #8892a6;
    --brand: #5ec8d8;
    --brand-strong: #7fe0ee;
    --user-bubble: #1f2937;
    --ok: #4ade80;
    --error: #f87171;
    --warn: #fbbf24;
    --tool: #c084fc;
    --radius: 14px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --panel-2: #eef1f8;
      --border: #dde3ef;
      --text: #14171f;
      --text-dim: #5b6472;
      --brand: #0e93a8;
      --brand-strong: #0a7c8f;
      --user-bubble: #e7ecf6;
      --ok: #16a34a;
      --error: #dc2626;
      --warn: #b45309;
      --tool: #7c3aed;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  header .brand { font-weight: 700; font-size: 16px; letter-spacing: 0.2px; }
  header .brand span { color: var(--brand-strong); }
  header .meta { color: var(--text-dim); font-size: 12.5px; display: flex; gap: 10px; flex-wrap: wrap; }
  header .spacer { flex: 1; }
  header .btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    cursor: pointer;
  }
  header .btn:hover { border-color: var(--brand); color: var(--brand-strong); }

  #servers-strip {
    display: flex;
    gap: 8px;
    padding: 8px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
    overflow-x: auto;
    font-size: 12px;
  }
  .server-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    white-space: nowrap;
    color: var(--text-dim);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.connected { background: var(--ok); }
  .dot.failed { background: var(--error); }
  .dot.disabled, .dot.other { background: var(--text-dim); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 22px 0 140px 0;
  }
  #timeline {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: var(--radius);
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.user { background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .bubble.assistant {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble.assistant :first-child { margin-top: 0; }
  .bubble.assistant :last-child { margin-bottom: 0; }
  .bubble.assistant code {
    background: var(--panel-2);
    padding: 1px 5px;
    border-radius: 5px;
    font-family: var(--mono);
    font-size: 0.9em;
  }
  .bubble.assistant pre {
    background: var(--panel-2);
    padding: 10px 12px;
    border-radius: 8px;
    overflow-x: auto;
  }
  .bubble.assistant pre code { background: none; padding: 0; }
  .bubble.assistant ul { padding-left: 20px; margin: 6px 0; }
  .bubble.assistant h1, .bubble.assistant h2, .bubble.assistant h3 {
    font-size: 1em;
    margin: 10px 0 4px;
    color: var(--brand-strong);
  }

  .system-line {
    align-self: center;
    color: var(--text-dim);
    font-size: 12.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .system-line.warn { color: var(--warn); }
  .system-line.error { color: var(--error); }
  .system-line.success { color: var(--ok); }

  .thinking {
    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-dim);
    font-size: 13px;
    padding: 4px 2px;
  }
  .thinking .dots span {
    display: inline-block;
    width: 5px; height: 5px;
    margin-right: 3px;
    border-radius: 50%;
    background: var(--brand);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .thinking .dots span:nth-child(2) { animation-delay: 0.15s; }
  .thinking .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  details.tool-card {
    align-self: flex-start;
    width: 100%;
    max-width: 82%;
    border: 1px solid var(--border);
    border-left: 3px solid var(--tool);
    border-radius: 10px;
    background: var(--panel);
    font-size: 12.5px;
  }
  details.tool-card[open] { padding-bottom: 8px; }
  details.tool-card summary {
    cursor: pointer;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    list-style: none;
  }
  details.tool-card summary::-webkit-details-marker { display: none; }
  .tool-card .badge {
    font-family: var(--mono);
    color: var(--tool);
  }
  .tool-card .status { font-weight: 600; }
  .tool-card .status.ok { color: var(--ok); }
  .tool-card .status.fail { color: var(--error); }
  .tool-card .meta-right { margin-left: auto; color: var(--text-dim); font-family: var(--mono); font-size: 11.5px; }
  .tool-card pre {
    margin: 0 12px 4px 12px;
    padding: 8px 10px;
    background: var(--panel-2);
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 12px;
    overflow-x: auto;
    white-space: pre-wrap;
  }
  .tool-card .section-label { padding: 6px 12px 0; color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }

  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    padding: 18px 18px 20px;
  }
  #composer {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 10px 10px 16px;
  }
  #composer textarea {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font: inherit;
    max-height: 160px;
  }
  #composer textarea::placeholder { color: var(--text-dim); }
  #send {
    background: var(--brand);
    color: #06232a;
    border: none;
    border-radius: 10px;
    padding: 9px 16px;
    font-weight: 600;
    cursor: pointer;
    flex: none;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  #hint { max-width: 780px; margin: 6px auto 0; color: var(--text-dim); font-size: 11.5px; text-align: center; }

  #modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding-top: 8vh;
    z-index: 10;
  }
  #modal-overlay.open { display: flex; }
  #modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: min(640px, 92vw);
    max-height: 78vh;
    overflow-y: auto;
    padding: 18px 20px;
  }
  #modal h2 { margin: 0 0 12px; font-size: 15px; color: var(--brand-strong); }
  #modal table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #modal th { text-align: left; color: var(--text-dim); font-weight: 600; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  #modal td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  #modal .close-row { text-align: right; margin-top: 10px; }
</style>
</head>
<body>
  <header>
    <div class="brand">Adopta<span>Match</span></div>
    <div class="meta" id="header-meta">connecting…</div>
    <div class="spacer"></div>
    <button class="btn" id="btn-servers">Servers</button>
    <button class="btn" id="btn-tools">Tools</button>
    <button class="btn" id="btn-logs">Logs</button>
    <button class="btn" id="btn-clear">Clear</button>
  </header>
  <div id="servers-strip"></div>

  <main><div id="timeline"></div></main>

  <footer>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="Ask anything, or describe your home to get a pet recommendation…"></textarea>
      <button id="send">Send</button>
    </div>
    <div id="hint">Enter to send · Shift+Enter for a new line</div>
  </footer>

  <div id="modal-overlay"><div id="modal"></div></div>

<script>
(() => {
  const timeline = document.getElementById("timeline");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const headerMeta = document.getElementById("header-meta");
  const serversStrip = document.getElementById("servers-strip");
  const modalOverlay = document.getElementById("modal-overlay");
  const modal = document.getElementById("modal");

  let thinkingEl = null;
  let toolCards = {};
  let toolSeq = 0;

  function scrollToBottom() {
    window.scrollTo(0, document.body.scrollHeight);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  // A deliberately small Markdown renderer: bold, inline code, fenced code
  // blocks, headers and bullet lists. That covers everything this model's
  // answers actually use; anything else is shown as plain, safely-escaped text.
  function renderMarkdown(text) {
    const blocks = text.split(/\n{2,}/);
    return blocks.map((block) => {
      const fence = block.match(/^```[\w-]*\n([\s\S]*?)\n?```$/);
      if (fence) return `<pre><code>${escapeHtml(fence[1])}</code></pre>`;

      const lines = block.split("\n");
      if (lines.every((l) => /^\s*[-*]\s+/.test(l))) {
        const items = lines.map((l) => `<li>${inline(l.replace(/^\s*[-*]\s+/, ""))}</li>`).join("");
        return `<ul>${items}</ul>`;
      }
      const heading = block.match(/^(#{1,3})\s+(.*)$/);
      if (heading) {
        const level = heading[1].length;
        return `<h${level}>${inline(heading[2])}</h${level}>`;
      }
      return `<p>${lines.map(inline).join("<br>")}</p>`;
    }).join("");
  }
  function inline(s) {
    let out = escapeHtml(s);
    out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
    out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    return out;
  }

  function addRow(role, html) {
    const row = document.createElement("div");
    row.className = `row ${role}`;
    const bubble = document.createElement("div");
    bubble.className = `bubble ${role}`;
    bubble.innerHTML = html;
    row.appendChild(bubble);
    timeline.appendChild(row);
    scrollToBottom();
  }

  function addSystemLine(kind, text) {
    const el = document.createElement("div");
    el.className = `system-line ${kind}`;
    const glyph = { warn: "!", error: "✗", success: "✓", info: "·" }[kind] || "·";
    el.textContent = `${glyph} ${text}`;
    timeline.appendChild(el);
    scrollToBottom();
  }

  function setThinking(on, message) {
    if (on) {
      if (thinkingEl) return;
      thinkingEl = document.createElement("div");
      thinkingEl.className = "thinking";
      thinkingEl.innerHTML =
        `<span class="dots"><span></span><span></span><span></span></span>${escapeHtml(message || "thinking")}…`;
      timeline.appendChild(thinkingEl);
      scrollToBottom();
    } else if (thinkingEl) {
      thinkingEl.remove();
      thinkingEl = null;
    }
  }

  function addToolCall(name, server, args) {
    const id = `tool-${++toolSeq}`;
    const card = document.createElement("details");
    card.className = "tool-card";
    card.id = id;
    card.innerHTML = `
      <summary>
        <span class="status">▸</span>
        <span class="badge">${escapeHtml(server)}.${escapeHtml(name)}</span>
        <span class="meta-right">running…</span>
      </summary>
      <div class="section-label">arguments</div>
      <pre>${escapeHtml(JSON.stringify(args, null, 2))}</pre>
      <div class="result-slot"></div>
    `;
    timeline.appendChild(card);
    toolCards[`${server}.${name}`] = toolCards[`${server}.${name}`] || [];
    toolCards[`${server}.${name}`].push(id);
    scrollToBottom();
    return id;
  }

  function addToolResult(ev) {
    const key = `${ev.server}.${ev.tool}`;
    const queue = toolCards[key];
    const id = queue && queue.length ? queue.shift() : null;
    const card = id ? document.getElementById(id) : null;
    if (!card) return;
    const status = card.querySelector(".status");
    const metaRight = card.querySelector(".meta-right");
    status.textContent = ev.ok ? "✓" : "✗";
    status.className = `status ${ev.ok ? "ok" : "fail"}`;
    metaRight.textContent = `${ev.elapsed_ms} ms · ${ev.request_id}`;
    const slot = card.querySelector(".result-slot");
    slot.innerHTML = `<div class="section-label">result</div><pre>${escapeHtml(ev.text)}</pre>`;
  }

  function renderServersStrip(servers) {
    serversStrip.innerHTML = "";
    let connected = 0, tools = 0;
    for (const s of servers) {
      if (s.state === "connected") { connected++; tools += s.tool_count || 0; }
      const chip = document.createElement("div");
      chip.className = "server-chip";
      chip.title = s.detail || "";
      chip.innerHTML = `<span class="dot ${s.state === "connected" ? "connected" : s.state === "failed" ? "failed" : "other"}"></span>${escapeHtml(s.name)}${s.state === "connected" ? ` (${s.tool_count})` : ""}`;
      serversStrip.appendChild(chip);
    }
    headerMeta.dataset.connected = connected;
    headerMeta.dataset.total = servers.length;
    updateHeaderMeta();
  }

  let lastReady = null;
  function updateHeaderMeta() {
    if (!lastReady) return;
    const c = headerMeta.dataset.connected || "0";
    const t = headerMeta.dataset.total || "0";
    headerMeta.textContent = `${lastReady.provider} · ${lastReady.model} · ${c}/${t} servers · session ${lastReady.session_id.slice(0, 8)}`;
  }

  function openModal(html) {
    modal.innerHTML = html + '<div class="close-row"><button class="btn" id="modal-close">Close</button></div>';
    modalOverlay.classList.add("open");
    document.getElementById("modal-close").onclick = () => modalOverlay.classList.remove("open");
  }
  modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove("open"); });

  function showServersModal(servers) {
    const rows = servers.map((s) => `
      <tr>
        <td>${escapeHtml(s.name)}</td>
        <td>${escapeHtml(s.transport)}</td>
        <td>${escapeHtml(s.state)}</td>
        <td>${escapeHtml(s.protocol_version || "-")}</td>
        <td>${s.tool_count ?? "-"}</td>
      </tr>`).join("");
    openModal(`<h2>MCP servers</h2><table><thead><tr><th>name</th><th>transport</th><th>state</th><th>protocol</th><th>tools</th></tr></thead><tbody>${rows}</tbody></table>`);
  }
  function showToolsModal(tools) {
    const rows = tools.map((t) => `
      <tr>
        <td>${escapeHtml(t.exposed_name)}</td>
        <td>${escapeHtml(t.server)}</td>
        <td>${escapeHtml((t.description || "").slice(0, 90))}</td>
      </tr>`).join("");
    openModal(`<h2>Tools (${tools.length})</h2><table><thead><tr><th>name</th><th>server</th><th>description</th></tr></thead><tbody>${rows}</tbody></table>`);
  }
  function showLogsModal(summary, recent) {
    const rows = recent.map((r) => `
      <tr>
        <td>${escapeHtml(String(r.timestamp || "").slice(11, 23))}</td>
        <td>${escapeHtml(r.server || "")}</td>
        <td>${escapeHtml(r.direction || "")}</td>
        <td>${escapeHtml(r.method || "")}</td>
        <td>${r.elapsed_ms ?? ""}</td>
      </tr>`).join("");
    openModal(`
      <h2>Session ${escapeHtml(summary.session_id)}</h2>
      <p style="color:var(--text-dim);font-size:13px">${summary.events} events · ${summary.tool_calls} tool calls · ${summary.errors} errors</p>
      <p style="color:var(--text-dim);font-size:12px;font-family:var(--mono)">${escapeHtml(summary.path)}</p>
      <table><thead><tr><th>time</th><th>server</th><th>dir</th><th>method</th><th>ms</th></tr></thead><tbody>${rows}</tbody></table>
    `);
  }

  // ------------------------------------------------------------- WebSocket

  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}/ws`);
  let ready = false;

  ws.onopen = () => { headerMeta.textContent = "connected · starting MCP servers…"; };
  ws.onclose = () => {
    ready = false;
    sendBtn.disabled = true;
    addSystemLine("error", "Disconnected. Reload the page to start a new session.");
  };
  ws.onerror = () => addSystemLine("error", "WebSocket error. Check the terminal running adoptamatch-chatbot-web.");

  ws.onmessage = (event) => {
    const ev = JSON.parse(event.data);
    switch (ev.type) {
      case "ready":
        lastReady = ev;
        ready = true;
        sendBtn.disabled = false;
        updateHeaderMeta();
        break;
      case "servers":
        renderServersStrip(ev.servers);
        window.__lastServers = ev.servers;
        break;
      case "tools":
        showToolsModal(ev.tools);
        break;
      case "logs":
        showLogsModal(ev.summary, ev.recent);
        break;
      case "help":
        openModal(`<h2>Commands</h2><table><tbody>${Object.entries(ev.commands).map(([k, v]) => `<tr><td style="font-family:var(--mono)">${escapeHtml(k)}</td><td>${escapeHtml(v)}</td></tr>`).join("")}</tbody></table>`);
        break;
      case "thinking":
        setThinking(ev.state === "start", ev.message);
        break;
      case "tool_call":
        setThinking(false);
        addToolCall(ev.name, ev.server, ev.arguments);
        break;
      case "tool_result":
        addToolResult(ev);
        break;
      case "assistant":
        setThinking(false);
        addRow("assistant", renderMarkdown(ev.text));
        break;
      case "warn": addSystemLine("warn", ev.text); break;
      case "error": setThinking(false); addSystemLine("error", ev.text); break;
      case "success": addSystemLine("success", ev.text); break;
      case "info": addSystemLine("info", ev.text); break;
      case "turn_summary":
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
        break;
      case "closed":
        addSystemLine("info", ev.text);
        ws.close();
        break;
    }
  };

  function send(text) {
    if (!ready) return;
    ws.send(JSON.stringify({ text }));
  }

  function submit() {
    const text = input.value.trim();
    if (!text) return;
    if (!text.startsWith("/")) {
      addRow("user", escapeHtml(text));
      sendBtn.disabled = true;
      input.disabled = true;
    }
    send(text);
    input.value = "";
    input.style.height = "auto";
  }

  sendBtn.addEventListener("click", submit);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });

  document.getElementById("btn-servers").onclick = () => window.__lastServers && showServersModal(window.__lastServers);
  document.getElementById("btn-tools").onclick = () => send("/tools");
  document.getElementById("btn-logs").onclick = () => send("/logs");
  document.getElementById("btn-clear").onclick = () => {
    if (confirm("Erase the conversation context? MCP connections stay open.")) {
      timeline.innerHTML = "";
      send("/clear");
    }
  };
})();
</script>
</body>
</html>
