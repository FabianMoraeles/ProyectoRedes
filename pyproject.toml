[project]
name = "adoptamatch-chatbot"
version = "1.0.0"
description = "Console chatbot that acts as an MCP host: one LLM, many MCP servers, one audit log"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Fabian Mora" }]

dependencies = [
    "mcp>=2.1.1",
    "anthropic>=1.3.0",
    "pydantic>=2.13",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
adoptamatch-chatbot = "adoptamatch_chatbot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adoptamatch_chatbot"]

[tool.ruff]
line-length = 110
target-version = "py310"
# remote_server is a separate project with its own pyproject; the rest are
# generated or third-party trees that must never be linted.
exclude = ["remote_server", ".venv", "demo_workspace", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
