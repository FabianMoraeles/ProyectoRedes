[project]
name = "adoptforme-chatbot"
version = "1.0.0"
description = "Console chatbot that acts as an MCP host: one LLM, many MCP servers, one audit log"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Fabian Mora" }]

# MCP is implemented directly over JSON-RPC in `adoptforme_chatbot.mcp_wire`;
# there is no MCP SDK at runtime. httpx2 is the HTTP client the Streamable HTTP
# transport is built on. anthropic and google-genai are the two interchangeable
# LLMProvider backends (llm/base.py); only one is used per run, picked by
# LLM_PROVIDER. starlette/uvicorn/websockets serve the optional browser
# front end (adoptforme_chatbot.web) -- an alternative presentation layer
# over the same ChatApp/MCPManager the terminal uses, not a second host.
dependencies = [
    "anthropic>=1.3.0",
    "google-genai>=1.21.0",
    "httpx2>=2.12",
    "pydantic>=2.13",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "starlette>=0.47",
    "tomli>=2.0; python_version < '3.11'",
    "uvicorn>=0.34",
    "websockets>=13",
]

[project.scripts]
adoptforme-chatbot = "adoptforme_chatbot.cli:main"
adoptforme-chatbot-web = "adoptforme_chatbot.web.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    # Test-only: the official SDK acts as a reference peer, proving the
    # hand-written client and the hand-written servers are wire-compatible with a
    # conforming implementation. Nothing in the package imports it.
    "mcp>=2.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adoptforme_chatbot"]

[tool.ruff]
line-length = 110
target-version = "py310"
# remote_server is a separate project with its own pyproject; the rest are
# generated or third-party trees that must never be linted.
exclude = ["remote_server", ".venv", "demo_workspace", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
