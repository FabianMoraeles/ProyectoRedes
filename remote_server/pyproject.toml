[project]
name = "pet-care-mcp"
version = "1.0.0"
description = "Small MCP server served over Streamable HTTP: generic pet care guidance"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Fabian Mora" }]
# MCP is implemented directly over JSON-RPC in `pet_care_mcp.minimcp`; no MCP
# SDK at runtime. Starlette and uvicorn are an HTTP framework and server, not
# MCP libraries; pydantic derives JSON Schemas from the tool signatures.
dependencies = [
    "pydantic>=2.11",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.scripts]
pet-care-mcp = "pet_care_mcp.server:main"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    # Test-only: the official SDK acts as a reference client, proving this
    # hand-written server is wire-compatible with a conforming host. Nothing in
    # the shipped package imports it.
    "mcp>=2.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pet_care_mcp"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
